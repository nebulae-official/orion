<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .swatch { border-radius: 12px; padding: 12px 14px; display:flex; flex-direction:column; justify-content:space-between; min-height: 104px; color:#FFF; box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 4px 16px rgba(0,0,0,0.3); }
  .swatch .name { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; }
  .swatch .hex { font-family: 'JetBrains Mono', 'JetBrains Mono', ui-monospace, monospace; font-size:11px; opacity:0.85; }
  .swatch .sub { font-size:10px; letter-spacing:0.15em; text-transform:uppercase; opacity:0.8; }
</style>
</head>
<body>
<div class="card-root">
  <div class="muted-bg"></div>
  <div class="stage">
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
      <div class="swatch" style="background:#7C3AED;">
        <div class="sub">Primary</div>
        <div><div class="name">Nebula Violet</div><div class="hex">#7C3AED</div></div>
      </div>
      <div class="swatch" style="background:#A78BFA; color:#2D033B;">
        <div class="sub">Primary / Light</div>
        <div><div class="name">Lavender</div><div class="hex">#A78BFA</div></div>
      </div>
      <div class="swatch" style="background:#06B6D4;">
        <div class="sub">Secondary</div>
        <div><div class="name">Starlight Cyan</div><div class="hex">#06B6D4</div></div>
      </div>
      <div class="swatch" style="background:#F59E0B; color:#4a2f02;">
        <div class="sub">Accent</div>
        <div><div class="name">Golden Star</div><div class="hex">#F59E0B</div></div>
      </div>
    </div>
  </div>
</div>
</body></html>
