<!doctype html>
<html><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .badge { display:inline-flex; align-items:center; gap:4px; padding: 3px 10px; border-radius: 9999px; font-size: 11px; font-weight:500; font-family: "Geist", sans-serif; }
  .badge svg { width:13px; height:13px; stroke-width:2; }
  .dot { width:6px; height:6px; border-radius:50%; }
</style>
</head>
<body>
<div class="card-root">
  <div class="muted-bg"></div>
  <div class="stage">
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <span class="badge" style="background: rgba(16,185,129,0.12); color:#34D399;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          Approved
        </span>
        <span class="badge" style="background: rgba(245,158,11,0.12); color:#FBBF24;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          In Review
        </span>
        <span class="badge" style="background: rgba(239,68,68,0.12); color:#F87171;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
          Rejected
        </span>
        <span class="badge" style="background: rgba(124,58,237,0.10); color:#A78BFA;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 15.5A2 2 0 0 0 8.5 14.1L2.4 12.5a.5.5 0 0 1 0-1l6.1-1.5A2 2 0 0 0 9.9 8.5l1.6-6.1a.5.5 0 0 1 1 0L14 8.5a2 2 0 0 0 1.4 1.4l6.2 1.6a.5.5 0 0 1 0 1l-6.2 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/></svg>
          Generating
        </span>
        <span class="badge" style="background: rgba(59,130,246,0.12); color:#60A5FA;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
          Published
        </span>
        <span class="badge" style="background:#1a2234; color:#94A3B8;">
          <span class="dot" style="background:#64748B;"></span>
          Draft
        </span>
      </div>
      <!-- Trend table status tokens -->
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <span class="badge" style="background: rgba(59,130,246,0.12); color:#60A5FA; letter-spacing:0.05em;">NEW</span>
        <span class="badge" style="background: rgba(245,158,11,0.12); color:#FBBF24; letter-spacing:0.05em;">PROCESSING</span>
        <span class="badge" style="background: rgba(16,185,129,0.12); color:#34D399; letter-spacing:0.05em;">USED</span>
        <span class="badge" style="background:#1a2234; color:#64748B; letter-spacing:0.05em;">DISCARDED</span>
        <span class="badge" style="background: rgba(124,58,237,0.10); color:#A78BFA; letter-spacing:0.2em; text-transform:uppercase; font-family:'Space Grotesk',sans-serif; font-size:10px;">LIVE VIEW</span>
      </div>
    </div>
  </div>
</div>
</body></html>
