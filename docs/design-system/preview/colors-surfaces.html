<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Surfaces</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .s { border-radius: 10px; padding: 10px 12px; display:flex; flex-direction:column; justify-content:space-between; min-height: 90px; border: 1px solid rgba(255,255,255,0.06); }
  .s .name { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; color:#F1F5F9; }
  .s .hex { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size:10px; color:#94A3B8; }
  .s .sub { font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:#64748B; }
</style>
</head>
<body>
<div class="card-root">
  <div class="muted-bg"></div>
  <div class="stage">
    <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap: 8px;">
      <div class="s" style="background:#080b14;"><div class="sub">BG Deep</div><div><div class="name">Void</div><div class="hex">#080b14</div></div></div>
      <div class="s" style="background:#0B0F19;"><div class="sub">BG</div><div><div class="name">Background</div><div class="hex">#0B0F19</div></div></div>
      <div class="s" style="background:#111827;"><div class="sub">Surface</div><div><div class="name">Sidebar</div><div class="hex">#111827</div></div></div>
      <div class="s" style="background:#1a2234;"><div class="sub">Elevated</div><div><div class="name">Input / Sub</div><div class="hex">#1a2234</div></div></div>
      <div class="s" style="background:#1f2b3d;"><div class="sub">Hover</div><div><div class="name">Hover</div><div class="hex">#1f2b3d</div></div></div>
    </div>
  </div>
</div>
</body></html>
