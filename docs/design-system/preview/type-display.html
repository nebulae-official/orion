<!doctype html>
<html><head><meta charset="utf-8"><title>Typography — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card-root">
  <div class="muted-bg"></div>
  <div class="stage">
    <div style="display:grid; grid-template-columns: 90px 1fr; gap: 14px 22px; align-items: baseline;">
      <div style="font-size:10px; color:#64748B; letter-spacing:0.15em; text-transform:uppercase;">Display 48</div>
      <div style="font-family:'Space Grotesk',sans-serif; font-size:48px; font-weight:700; letter-spacing:-0.02em; line-height:1.05; color:#F1F5F9;">Welcome to Orion</div>

      <div style="font-size:10px; color:#64748B; letter-spacing:0.15em; text-transform:uppercase;">H1 36</div>
      <div style="font-family:'Space Grotesk',sans-serif; font-size:36px; font-weight:700; letter-spacing:-0.02em; line-height:1.1; color:#F1F5F9;">System Performance</div>

      <div style="font-size:10px; color:#64748B; letter-spacing:0.15em; text-transform:uppercase;">H2 24</div>
      <div style="font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; letter-spacing:-0.02em; color:#F1F5F9;">Recent Events</div>
    </div>
  </div>
</div>
</body></html>
