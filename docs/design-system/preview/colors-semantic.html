<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .s { border-radius: 12px; padding: 12px 14px; display:flex; flex-direction:column; justify-content:space-between; min-height: 100px; color:#FFF; box-shadow: inset 0 1px 0 rgba(255,255,255,0.15); }
  .s .name { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13px; }
  .s .hex { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size:11px; opacity:0.85; }
  .s .sub { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; opacity:0.85; }
</style>
</head>
<body>
<div class="card-root">
  <div class="muted-bg"></div>
  <div class="stage">
    <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;">
      <div class="s" style="background:#10B981;"><div class="sub">Success</div><div><div class="name">Emerald</div><div class="hex">#10B981</div></div></div>
      <div class="s" style="background:#F59E0B; color:#3a2505;"><div class="sub">Warning</div><div><div class="name">Amber</div><div class="hex">#F59E0B</div></div></div>
      <div class="s" style="background:#EF4444;"><div class="sub">Danger</div><div><div class="name">Vermilion</div><div class="hex">#EF4444</div></div></div>
      <div class="s" style="background:#3B82F6;"><div class="sub">Info</div><div><div class="name">Azure</div><div class="hex">#3B82F6</div></div></div>
    </div>
  </div>
</div>
</body></html>
