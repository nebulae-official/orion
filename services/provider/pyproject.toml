[project]
name = "orion-provider"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "orion-common",
    "litellm>=1.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "nvidia-riva-client",
    "grpcio>=1.80.0",
]

[tool.uv.sources]
orion-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
]
